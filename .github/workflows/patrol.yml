name: Patrol

# Runs every journey against the deployed crime scene with hidden faults, opens a
# case for each failure, retrains the classifier on everything collected so far,
# and commits the documents to the runs-data branch that the dashboard reads.
on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_run:
    workflows: [Deploy site]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: patrol
  cancel-in-progress: false

jobs:
  patrol:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Check out the data branch
        run: |
          if git ls-remote --exit-code --heads origin runs-data > /dev/null; then
            git fetch --depth=1 origin runs-data
            git worktree add .runs-data FETCH_HEAD
          else
            git worktree add --detach .runs-data
            git -C .runs-data checkout --orphan runs-data
            git -C .runs-data rm -rf --quiet .
          fi

      - name: Patrol
        run: |
          # The crime scene is deployed with the dashboard at https://<owner>.github.io/<repo>/crime-scene/
          target="https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${GITHUB_REPOSITORY#*/}/crime-scene/"
          npm run patrol -- --data .runs-data --target "$target" --trigger "${{ github.event_name }}" --retrain

      - name: Commit the case files
        working-directory: .runs-data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Patrol $(date -u +%Y-%m-%dT%H:%MZ)"
          git push origin HEAD:runs-data
